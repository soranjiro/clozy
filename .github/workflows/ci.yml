name: CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-fund
      - name: Bootstrap dependency lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/privacy-first-mvp'
        run: |
          echo CLOZY_LOCK_BEGIN
          base64 -w 76 package-lock.json
          echo CLOZY_LOCK_END
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high --omit=dev
